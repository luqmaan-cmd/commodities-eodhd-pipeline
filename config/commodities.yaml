# EODHD Commodities Configuration
# Central source of truth for all tracked commodities.
# Symbol format for API: {api_code}  e.g. GC.COMM

commodities:
  # ── Energy ──────────────────────────────────────
  - symbol: CL
    name: Crude Oil (WTI)
    api_code: CL.COMM
    category: Energy

  - symbol: BZ
    name: Brent Crude
    api_code: BZ.COMM
    category: Energy

  - symbol: NG
    name: Natural Gas
    api_code: NG.COMM
    category: Energy

  - symbol: HO
    name: Heating Oil
    api_code: HO.COMM
    category: Energy

  - symbol: RB
    name: RBOB Gasoline
    api_code: RB.COMM
    category: Energy

  - symbol: EH
    name: Ethanol
    api_code: EH.COMM
    category: Energy

  - symbol: NCFY
    name: Newcastle Coal
    api_code: NCFY.COMM
    category: Energy

  # ── Precious Metals ─────────────────────────────
  - symbol: GC
    name: Gold (COMEX)
    api_code: GC.COMM
    category: Precious Metals

  - symbol: SI
    name: Silver
    api_code: SI.COMM
    category: Precious Metals

  - symbol: PL
    name: Platinum
    api_code: PL.COMM
    category: Precious Metals

  - symbol: PA
    name: Palladium
    api_code: PA.COMM
    category: Precious Metals

  # ── Industrial Metals ───────────────────────────
  - symbol: HG
    name: Copper
    api_code: HG.COMM
    category: Industrial Metals
    anomaly_threshold: 500.0  # EODHD returns data in different denominations (unit changes)

  - symbol: ALI
    name: Aluminum (COMEX)
